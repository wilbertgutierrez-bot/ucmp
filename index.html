<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Latin Night Thursdays – UC Music Project</title>
  <style>
    *, *::before, *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #000;
    }

    /* =============================================
       BANNER WRAPPER
    ============================================= */
    .ln-banner {
      position: relative;
      width: 100%;
      background: #000;
      display: flex;
      flex-direction: row;
      align-items: stretch;
      overflow: hidden;
      min-height: 340px;
      max-height: 620px;
      aspect-ratio: 16 / 6;
    }

    /* =============================================
       LEFT TEXT COLUMN
    ============================================= */
    .ln-left {
      position: relative;
      flex: 0 0 26%;
      background: #000;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: flex-start;
      padding: 5% 6%;
      z-index: 10;
      overflow: hidden;
    }

    .ln-logo {
      width: 100%;
      max-width: 320px;
      height: auto;
      display: block;

      /* Scale from 160% → 100% and fade in */
      opacity: 0;
      animation: scaleInFade 0.9s cubic-bezier(0.22, 0.61, 0.36, 1) 2.0s forwards;
    }

    /* =============================================
       PHOTO PANELS
    ============================================= */
    .ln-photos {
      flex: 1 1 74%;
      display: flex;
      flex-direction: row;
      align-items: stretch;
    }

    .ln-panel {
      position: relative;
      flex: 1;
      overflow: hidden;
    }

    .ln-panel img.photo {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: top center;
      display: block;
    }

    /* Slide from top */
    .ln-panel--red {
      opacity: 0;
      animation: slideFromTop 0.75s cubic-bezier(0.22, 0.61, 0.36, 1) 0s forwards;
    }

    /* Slide from bottom */
    .ln-panel--green {
      opacity: 0;
      animation: slideFromBottom 0.75s cubic-bezier(0.22, 0.61, 0.36, 1) 0.65s forwards;
    }

    /* Slide from top */
    .ln-panel--blue {
      opacity: 0;
      animation: slideFromTop 0.75s cubic-bezier(0.22, 0.61, 0.36, 1) 1.3s forwards;
    }

    /* =============================================
       TEXT OVERLAY (text.png) – full banner
       Positions over the whole banner absolutely
    ============================================= */
    .ln-text-overlay {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 20;

      opacity: 0;
      animation: fadeIn 0.7s ease 2.85s forwards;
    }

    .ln-text-overlay img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      object-position: center;
      display: block;
    }

    /* =============================================
       KEYFRAME ANIMATIONS
    ============================================= */
    @keyframes slideFromTop {
      from {
        transform: translateY(-100%);
        opacity: 0;
      }
      to {
        transform: translateY(0);
        opacity: 1;
      }
    }

    @keyframes slideFromBottom {
      from {
        transform: translateY(100%);
        opacity: 0;
      }
      to {
        transform: translateY(0);
        opacity: 1;
      }
    }

    @keyframes scaleInFade {
      from {
        transform: scale(1.6);
        opacity: 0;
      }
      to {
        transform: scale(1);
        opacity: 1;
      }
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to   { opacity: 1; }
    }

    /* =============================================
       RESPONSIVE – TABLET (≤900px)
    ============================================= */
    @media (max-width: 900px) {
      .ln-banner {
        flex-direction: column;
        aspect-ratio: unset;
        min-height: unset;
        max-height: unset;
      }

      .ln-left {
        flex: unset;
        width: 100%;
        align-items: center;
        padding: 6% 8%;
      }

      .ln-logo {
        max-width: 280px;
      }

      .ln-photos {
        flex: unset;
        width: 100%;
        height: 56vw;
        max-height: 380px;
      }

      .ln-text-overlay img {
        object-fit: cover;
        object-position: bottom center;
      }
    }

    /* =============================================
       RESPONSIVE – MOBILE (≤540px)
    ============================================= */
    @media (max-width: 540px) {
      .ln-left {
        padding: 8% 10%;
      }

      .ln-logo {
        max-width: 220px;
      }

      .ln-photos {
        flex-direction: column;
        height: auto;
        max-height: unset;
      }

      .ln-panel {
        width: 100%;
        height: 70vw;
        max-height: 300px;
      }

      /* On mobile, stack panels and re-animate vertically */
      .ln-panel--red {
        animation-name: slideFromLeft;
      }
      .ln-panel--green {
        animation-name: slideFromRight;
      }
      .ln-panel--blue {
        animation-name: slideFromLeft;
      }
    }

    /* Extra animations for mobile stacked layout */
    @keyframes slideFromLeft {
      from {
        transform: translateX(-100%);
        opacity: 0;
      }
      to {
        transform: translateX(0);
        opacity: 1;
      }
    }

    @keyframes slideFromRight {
      from {
        transform: translateX(100%);
        opacity: 0;
      }
      to {
        transform: translateX(0);
        opacity: 1;
      }
    }
  </style>
</head>
<body>

  <header class="ln-banner">

    <!-- Left column: Latin Night logo -->
    <div class="ln-left">
      <img
        class="ln-logo"
        src="images/latin-thursdays.png"
        alt="Latin Night Thursdays"
      >
    </div>

    <!-- Three performer photos -->
    <div class="ln-photos">

      <!-- 1st: slides from TOP -->
      <div class="ln-panel ln-panel--red">
        <img class="photo" src="images/red.webp" alt="Performer – Percussion">
      </div>

      <!-- 2nd: slides from BOTTOM -->
      <div class="ln-panel ln-panel--green">
        <img class="photo" src="images/green.webp" alt="Ricard Sánchez – Violin">
      </div>

      <!-- 3rd: slides from TOP -->
      <div class="ln-panel ln-panel--blue">
        <img class="photo" src="images/blue.webp" alt="Performer – Guitar">
      </div>

    </div>

    <!-- Final text overlay: fades in last -->
    <div class="ln-text-overlay">
      <img src="images/text.png" alt="Event details – Ricard Sánchez Flamenco Trio">
    </div>

  </header>

</body>
</html>
